name: Check and publish

# Every push and pull request: check the spreadsheets and the app code.
# Pushes to main also rebuild both editions' websites and catalogs and publish
# them to the gh-pages branch, which GitHub Pages serves:
#   /cosmo2/                 Commercial & Graphics Content Hub
#   /cosmo2/transportation/  Transportation Safety Content Hub

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Check the content spreadsheets
        run: |
          python3 -m unittest discover tools
          python3 tools/build_catalog.py --out site
      - name: Check the app
        working-directory: app
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Build the websites
        working-directory: app
        run: |
          npm run build:web
          npm run build:web:transportation
      - name: Assemble the site
        run: |
          cp -r app/dist/. site/
          mkdir -p site/transportation
          cp -r app/dist-transportation/. site/transportation/
          cp -r thumbs site/thumbs
          cp site/index.html site/404.html   # lets deep links load the app
          touch site/.nojekyll               # Pages must serve the _expo folder
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          include-hidden-files: true

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - name: Push to gh-pages
        working-directory: site
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
